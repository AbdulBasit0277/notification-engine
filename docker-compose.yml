services:
  # ── Postgres 16 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notif
      POSTGRES_PASSWORD: notif
      POSTGRES_DB: notif
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif -d notif"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Localstack (SQS, SES, SNS) ───────────────────────────────────────────────
  localstack:
    image: localstack/localstack:3
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,ses,sns
      - DEFAULT_REGION=us-east-1
      - LOCALSTACK_HOST=localstack
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ── Localstack init: create SQS queues and seed SES ──────────────────────────
  localstack-init:
    image: localstack/localstack:3
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: ["/bin/sh", "-c", "/scripts/init-localstack.sh"]
    volumes:
      - ./scripts:/scripts

  # ── Notification Service ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      APP_DB_URL: "postgres://notif:notif@postgres:5432/notif?sslmode=disable"
      APP_AWS_ENDPOINT: "http://localstack:4566"
      APP_AWS_REGION: "us-east-1"
      APP_QUEUE_URL: "http://sqs.us-east-1.localstack:4566/000000000000/notifications.fifo"
      APP_DLQ_URL: "http://sqs.us-east-1.localstack:4566/000000000000/notifications-dlq.fifo"
      APP_FROM_EMAIL: "noreply@example.com"
      APP_WORKERS: "10"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"

volumes:
  pgdata:
  localstack_data:
